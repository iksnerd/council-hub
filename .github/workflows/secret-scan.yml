name: Secret Scan

# Full-history gitleaks scan on version tags, alongside ci.yml. Commits are
# gated earlier by .githooks/pre-commit, which scans the staged diff before a
# commit exists (install with `make install-hooks`); this is the backstop for a
# clone without the hook, before a release is published.
on:
  push:
    tags: [ "v*.*.*" ]

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
