name: Release

on:
  push:
    tags: [ "v*.*.*" ]

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get previous tag
        id: prev_tag
        run: |
          prev=$(git tag -l --sort=-version:refname | head -2 | tail -1)
          if [ -z "$prev" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=$prev" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        id: changelog
        run: |
          {
            echo 'changelog<<EOF'
            git log ${{ steps.prev_tag.outputs.tag }}..${{ github.ref_name }} --oneline | \
              sed 's/^/- /'
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body: |
            ## Changes
            ${{ steps.changelog.outputs.changelog }}

            ## Docker
            ```bash
            docker pull iksnerd/council-hub:${{ github.ref_name }}
            ```

            See [DOCKERHUB.md](https://github.com/iksnerd/council-hub/blob/main/DOCKERHUB.md) for setup instructions.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  inbox-binaries:
    # Runs after the release exists, so a build failure here never blocks the
    # release itself. Attaches static council-inbox binaries and checksums.txt,
    # which scripts/install-council-inbox.sh downloads.
    name: Attach council-inbox binaries
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: mcp-server/go.sum

      - name: Build council-inbox
        working-directory: mcp-server
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os=${target%/*}
            arch=${target#*/}
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" \
              -o "../dist/council-inbox_${os}_${arch}" ./cmd/council-inbox
          done
          cd ../dist
          sha256sum council-inbox_* > checksums.txt
          cat checksums.txt

      - name: Upload assets to the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/council-inbox_*
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
