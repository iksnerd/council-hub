services:
  council-hub:
    image: iksnerd/council-hub:latest
    # Loopback only: the hub has no authentication by default. The Erlang cluster
    # ports (4369, 9000) are not published at all. To reach it from another machine
    # use examples/docker-compose.secure.yml; to cluster use examples/docker-compose.cluster.yml.
    ports:
      - "127.0.0.1:4000:4000"
      - "127.0.0.1:3001:3001"
    volumes:
      - council-data:/data
    environment:
      - COUNCIL_TRANSPORT=http
      # Shared cluster secret — all nodes must use the same value. The default is
      # public; harmless while 4369/9000 are unpublished. examples/docker-compose.cluster.yml
      # requires a real COUNCIL_COOKIE.
      - RELEASE_COOKIE=${COUNCIL_COOKIE:-council}
      # Must include a reachable LAN IP, e.g. council_hub@192.168.1.10
      # The entrypoint will auto-detect if left as the loopback default,
      # but setting it explicitly is recommended for stable clustering.
      - RELEASE_NODE=${COUNCIL_NODE_NAME:-council_hub@127.0.0.1}
      # Peers to connect to: bare IP (192.168.1.11), MagicDNS name (bob), or full node@ip.
      # Omit for LAN auto-discovery. Set COUNCIL_NO_DISCOVER=1 to skip scan on VPN.
      - COUNCIL_SEEDS=${COUNCIL_SEEDS:-}
      - COUNCIL_NO_DISCOVER=${COUNCIL_NO_DISCOVER:-0}
      # Bearer token for /mcp (16+ characters; shorter makes the server refuse to
      # start). Empty = no auth. Clients send it as `Authorization: Bearer <token>`.
      - COUNCIL_AUTH_TOKEN=${COUNCIL_AUTH_TOKEN:-}
      # Optional second listener that serves the same hub WITHOUT the token, for
      # local clients. Set COUNCIL_TRUSTED_ADDR to a container address (e.g. :3002)
      # and COUNCIL_TRUSTED_PORT to the dashboard's matching port. Publish these
      # on host loopback ONLY. Example (in an override file), with the token set:
      #   ports:
      #     - "127.0.0.1:3001:3002"        # local clients, no token
      #     - "<tailnet-ip>:3001:3001"     # network clients, token required
      # Leave both empty for a single listener.
      - COUNCIL_TRUSTED_ADDR=${COUNCIL_TRUSTED_ADDR:-}
      - COUNCIL_TRUSTED_PORT=${COUNCIL_TRUSTED_PORT:-}
      # Ollama endpoint for semantic search (optional)
      - COUNCIL_OLLAMA_URL=${COUNCIL_OLLAMA_URL:-}
    # `always`, not `unless-stopped`: Docker Desktop records its own shutdown as a
    # manual stop, and `unless-stopped` then skips auto-start when the daemon comes
    # back — leaving the server down until someone runs `docker start` by hand.
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  council-data:
